# Tooling configuration only. There is deliberately no [build-system] here:
# backend/ is an application, not an installable package, and adding a build
# backend would make `pip install .` a supported-but-untested path.

[tool.ruff]
line-length = 100
# ruff has no py314 target yet; py313 is the closest supported target and does
# not restrict the syntax we can use.
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
# The ANN rules make "type hints everywhere" (AGENTS.md section 7) mechanically
# enforced rather than aspirational, without adding a mypy dependency.
select = ["E", "F", "I", "UP", "B", "ANN001", "ANN201", "ANN202", "ANN204"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom.

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN201", "ANN202"]  # fixtures and test functions

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "integration: needs a live Postgres with pgvector, or a Supabase project",
]

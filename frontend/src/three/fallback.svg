<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"
     role="presentation" focusable="false">
  <!--
    The static reading room. Three jobs, one drawing:

      1. the Suspense fallback while the three.js chunk loads,
      2. the whole scene under `prefers-reduced-motion`,
      3. the whole scene when WebGL is unavailable or its context is lost.

    Colours are literal rather than `currentColor` or `var(--x)` on purpose. An
    .svg loaded through <img> is an isolated document -- it inherits nothing from
    the page, so a token reference would resolve to nothing and the drawing would
    disappear. The palette is therefore chosen to read on both themes: white
    sheets carry a dark outline so they hold up against the light paper, and they
    are legible against the dark paper without one. The one accent is the spec's
    highlight, which is the same yellow in both themes by design.

    It shows the end state of the scroll story -- the strips split, one passage
    marked, the source slip attached, the tray below -- so a reader who never sees
    the canvas still gets the idea.
  -->
  <g fill="none" stroke="#17262B" stroke-width="1.5" stroke-linejoin="round">
    <!-- The stack. Two sheets behind the one being read. -->
    <g opacity="0.45">
      <rect x="96" y="86" width="300" height="392" rx="4" fill="#FFFFFF" />
    </g>
    <g opacity="0.7">
      <rect x="84" y="98" width="300" height="392" rx="4" fill="#FFFFFF" />
    </g>

    <!-- The sheet being read, split into its searchable strips. -->
    <rect x="72" y="110" width="300" height="392" rx="4" fill="#FFFFFF" />
    <g stroke-width="1">
      <path d="M72 166 H372 M72 210 H372 M72 254 H372 M72 298 H372 M72 342 H372 M72 386 H372 M72 430 H372" />
    </g>

    <!-- The section heading above the strips. -->
    <g stroke="none" fill="#17262B">
      <rect x="92" y="132" width="132" height="9" rx="4.5" opacity="0.85" />
    </g>

    <!-- Two strips lifted forward: the ones whose text matched. -->
    <g>
      <rect x="64" y="244" width="300" height="40" rx="3" fill="#FFFFFF" />
      <rect x="64" y="330" width="300" height="40" rx="3" fill="#FFFFFF" />
    </g>

    <!-- The marked passage, on the front lifted strip. -->
    <rect x="84" y="256" width="118" height="16" rx="2" fill="#F6D84C" stroke="none" />

    <!-- Lifted-strip text, as ruled lines. -->
    <g stroke="none" fill="#17262B" opacity="0.55">
      <rect x="212" y="260" width="130" height="7" rx="3.5" />
      <rect x="86" y="346" width="196" height="7" rx="3.5" />
    </g>

    <!-- The source slip, attached to the answer. -->
    <g>
      <rect x="452" y="196" width="264" height="132" rx="10" fill="#0E5A6B" stroke="none" />
      <g stroke="none" fill="#DCEBEE">
        <rect x="478" y="226" width="150" height="10" rx="5" />
      </g>
      <g stroke="none" fill="#FFFFFF" opacity="0.65">
        <rect x="478" y="252" width="120" height="7" rx="3.5" />
        <rect x="478" y="272" width="188" height="7" rx="3.5" />
        <rect x="478" y="292" width="96" height="7" rx="3.5" />
      </g>
    </g>

    <!-- The answer card the lifted strips slide into. -->
    <rect x="452" y="110" width="264" height="66" rx="10" fill="#FFFFFF" />
    <g stroke="none" fill="#17262B" opacity="0.75">
      <rect x="476" y="132" width="200" height="9" rx="4.5" />
      <rect x="476" y="152" width="140" height="7" rx="3.5" />
    </g>

    <!-- The tray the unanswerable question drops into. -->
    <g>
      <rect x="452" y="392" width="264" height="110" rx="10" fill="#FFFFFF" />
      <rect x="470" y="356" width="180" height="30" rx="4" fill="#FFFFFF" />
      <g stroke="none" fill="#A83A2E" opacity="0.8">
        <rect x="486" y="367" width="104" height="8" rx="4" />
      </g>
      <g stroke="none" fill="#4A5D63">
        <rect x="476" y="416" width="120" height="8" rx="4" />
        <rect x="476" y="440" width="196" height="7" rx="3.5" opacity="0.6" />
        <rect x="476" y="460" width="164" height="7" rx="3.5" opacity="0.6" />
      </g>
    </g>
  </g>
</svg>

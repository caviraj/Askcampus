<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusAsk</title>
    <meta
      name="description"
      content="Ask about college exams, admissions, departments, events, and academic processes."
    />
    <!--
      DESIGN_SYSTEM.md section 12: Source Serif 4 (400, 600) and IBM Plex Sans
      (400, 500). preconnect so the swap is as short as possible; the token
      stacks in tokens.css already name Georgia and system-ui, so the app stays
      readable if this request never lands.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Source+Serif+4:wght@400;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
